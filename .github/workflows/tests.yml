name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate model parameters
        run: python src/validate_parameters.py

      - name: Validate spectral absorption dataset
        run: python src/validate_spectral_data.py

      - name: Validate independent absorption benchmark
        run: python src/validate_benchmark_data.py